<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Para Maite 🌻</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:radial-gradient(circle at center,#0f2027,#000814);
    color:white;
    text-align:center;
    transition:background 5s linear;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

#content{
    position:relative;
    z-index:3;
    margin-top:40px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:75px;
    color:#ffd166;
    text-shadow:0 0 20px gold,0 0 60px orange;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px gold;}
    to{ text-shadow:0 0 40px gold,0 0 80px orange;}
}

h2{
    font-weight:300;
    margin:20px;
}

button{
    padding:14px 35px;
    font-size:18px;
    margin:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
}

#yes{
    background:linear-gradient(45deg,#ff4e50,#ff758c);
    color:white;
}

#no{
    background:gray;
    color:white;
    position:absolute;
}

.parchment{
    background:#f5deb3;
    color:#4b2e2e;
    padding:40px;
    border-radius:20px;
    max-width:600px;
    font-family:'Great Vibes',cursive;
    font-size:35px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="content">
    <h1>Maite 🌻</h1>
    <h2 id="text"></h2>
    <button id="yes">Sí 💕</button>
    <button id="no">No 😢</button>
</div>

<script>
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let regionsData=[];
let drawProgress=0;
let floatOffset=0;
let mouseX=canvas.width/2;
let mouseY=canvas.height/2;

let scale,center_x,center_y;

let explosion=false;
let explosionParticles=[];
let showRing=false;
let heartScale=0;
let flashAlpha=0;

let showConstellation=false;
let constellationAlpha=0;
let constellationPoints=[];
let shootingStar=null;
let wishAlpha=0;

// Mouse + touch
function updatePointer(x,y){mouseX=x;mouseY=y;}
document.addEventListener("mousemove",e=>updatePointer(e.clientX,e.clientY));
document.addEventListener("touchmove",e=>updatePointer(e.touches[0].clientX,e.touches[0].clientY));

canvas.addEventListener("click", triggerSecret);
canvas.addEventListener("touchstart", triggerSecret);

function triggerSecret(){
    if(explosion){
        showConstellation=true;
        constellationAlpha=1;
        wishAlpha=1;
        generateHeartConstellation();

        shootingStar={
            x:-canvas.width/2,
            y:-canvas.height/3,
            speed:15,
            length:120,
            alpha:1
        };
    }
}

function generateHeartConstellation(){
    constellationPoints=[];
    for(let t=0;t<Math.PI*2;t+=0.2){
        let x=16*Math.pow(Math.sin(t),3);
        let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
        constellationPoints.push({x:x*10,y:y*10});
    }
}

// Texto animado
let message="Desde que llegaste, todo florece más bonito 🌻✨ ¿Quieres ser mi San Valentín? 💖";
let i=0;
(function type(){
    if(i<message.length){
        document.getElementById("text").innerHTML+=message[i++];
        setTimeout(type,40);
    }
})();

// Botón NO
const noBtn=document.getElementById("no");
function moveNo(){
    noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("touchstart",moveNo);

// Botón SÍ
document.getElementById("yes").onclick=function(){
    explosion=true;
    showRing=true;
    flashAlpha=1;

    for(let i=0;i<300;i++){
        explosionParticles.push({
            angle:Math.random()*Math.PI*2,
            speed:2+Math.random()*4,
            radius:0,
            size:2+Math.random()*4
        });
    }
};

// Cargar girasol
fetch("sunflowers.json")
.then(res=>res.json())
.then(data=>{
    regionsData=data;

    let allPoints=[];
    regionsData.forEach(r=>r.contour.forEach(p=>allPoints.push(p)));

    let xs=allPoints.map(p=>p[0]);
    let ys=allPoints.map(p=>p[1]);

    let min_x=Math.min(...xs);
    let max_x=Math.max(...xs);
    let min_y=Math.min(...ys);
    let max_y=Math.max(...ys);

    let width=max_x-min_x;
    let height=max_y-min_y;

    scale=Math.min(350/width,350/height);
    center_x=(min_x+max_x)/2;
    center_y=(min_y+max_y)/2;

    animate();
});

function drawSunflower(){
    if(!regionsData.length) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(canvas.width/2+(mouseX-canvas.width/2)*0.03,
                  canvas.height/2+Math.sin(floatOffset)*12);

    ctx.shadowColor="gold";
    ctx.shadowBlur=60;

    regionsData.slice(0,drawProgress).forEach(region=>{
        let r=region.color[0]*255;
        let g=region.color[1]*255;
        let b=region.color[2]*255;

        ctx.fillStyle=`rgb(${r},${g},${b})`;
        ctx.beginPath();
        region.contour.forEach((point,index)=>{
            let x=(point[0]-center_x)*scale;
            let y=(center_y-point[1])*scale;
            index===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        });
        ctx.closePath();
        ctx.fill();
    });

    // Explosión
    if(explosion){
        explosionParticles.forEach(p=>{
            p.radius+=p.speed;
            let x=Math.cos(p.angle)*p.radius;
            let y=Math.sin(p.angle)*p.radius;

            ctx.beginPath();
            ctx.fillStyle="rgba(255,215,0,0.9)";
            ctx.arc(x,y,p.size,0,2*Math.PI);
            ctx.fill();
        });

        heartScale+=0.02;
        ctx.save();
        ctx.scale(heartScale,heartScale);
        ctx.beginPath();
        ctx.fillStyle="rgba(255,0,80,0.9)";
        ctx.moveTo(0,-20);
        ctx.bezierCurveTo(50,-80,120,-20,0,100);
        ctx.bezierCurveTo(-120,-20,-50,-80,0,-20);
        ctx.fill();
        ctx.restore();
    }

    // Constelación
    if(showConstellation){
        ctx.globalAlpha=constellationAlpha;
        ctx.strokeStyle="white";
        ctx.beginPath();
        constellationPoints.forEach((p,index)=>{
            if(index===0) ctx.moveTo(p.x,p.y-200);
            else ctx.lineTo(p.x,p.y-200);
        });
        ctx.stroke();

        constellationPoints.forEach(p=>{
            ctx.beginPath();
            ctx.arc(p.x,p.y-200,2,0,2*Math.PI);
            ctx.fill();
        });

        constellationAlpha-=0.005;
        if(constellationAlpha<=0) showConstellation=false;
    }

    // Estrella fugaz
    if(shootingStar){
        ctx.globalAlpha=shootingStar.alpha;
        ctx.strokeStyle="white";
        ctx.beginPath();
        ctx.moveTo(shootingStar.x,shootingStar.y);
        ctx.lineTo(shootingStar.x-shootingStar.length,
                   shootingStar.y-shootingStar.length/3);
        ctx.stroke();

        shootingStar.x+=shootingStar.speed;
        shootingStar.y+=shootingStar.speed/3;
        shootingStar.alpha-=0.01;

        if(shootingStar.alpha<=0) shootingStar=null;
    }

    // Texto deseo
    if(wishAlpha>0){
        ctx.globalAlpha=wishAlpha;
        ctx.fillStyle="white";
        ctx.font="28px Poppins";
        ctx.textAlign="center";
        ctx.fillText("Pide un deseo... 🌠",0,200);
        wishAlpha-=0.01;
    }

    ctx.restore();

    if(drawProgress<regionsData.length) drawProgress+=8;
    floatOffset+=0.03;
}

function animate(){
    drawSunflower();
    requestAnimationFrame(animate);
}
</script>

</body>
</html>
