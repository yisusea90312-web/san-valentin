<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Para Maite 🌻</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:radial-gradient(circle at center,#0f2027,#000814);
    color:white;
    text-align:center;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

#content{
    position:relative;
    z-index:2;
    margin-top:60px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:70px;
    color:#ffd166;
    text-shadow:0 0 20px gold;
}

h2{
    font-weight:300;
    margin:20px;
}

button{
    padding:14px 35px;
    font-size:18px;
    margin:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
}

#yes{
    background:linear-gradient(45deg,#ff4e50,#ff758c);
    color:white;
}

#no{
    background:gray;
    color:white;
    position:absolute;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="content">
    <h1>Maite 🌻</h1>
    <h2 id="text"></h2>
    <button id="yes">Sí 💕</button>
    <button id="no">No 😢</button>
</div>

<script>
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let regionsData=[];
let drawProgress=0;
let floatOffset=0;

fetch("sunflowers.json")
.then(res=>res.json())
.then(data=>{
    regionsData=data;
    animate();
});

// Texto animado
let message="Desde que llegaste, todo florece más bonito 🌻✨ ¿Quieres ser mi San Valentín? 💖";
let i=0;
(function type(){
    if(i<message.length){
        document.getElementById("text").innerHTML+=message[i++];
        setTimeout(type,40);
    }
})();

// Botón NO que huye (mouse y touch)
const noBtn=document.getElementById("no");
function moveNo(){
    noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("touchstart",moveNo);

// Botón SÍ
document.getElementById("yes").onclick=function(){
    document.body.innerHTML=`
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(180deg,#ff758c,#ff7eb3);color:white;font-family:'Great Vibes',cursive;font-size:40px;text-align:center;padding:40px;">
    Maite... 🌻<br><br>
    Prometo cuidarte, hacerte reír<br>
    y llenar tus días de momentos mágicos.<br><br>
    Gracias por existir 💛
    </div>
    `;
};

function drawSunflower(){

    if(!regionsData.length) return;

    let allPoints=[];
    regionsData.forEach(r=>r.contour.forEach(p=>allPoints.push(p)));

    let xs=allPoints.map(p=>p[0]);
    let ys=allPoints.map(p=>p[1]);

    let min_x=Math.min(...xs);
    let max_x=Math.max(...xs);
    let min_y=Math.min(...ys);
    let max_y=Math.max(...ys);

    let width=max_x-min_x;
    let height=max_y-min_y;
    let scale=Math.min(350/width,350/height);

    let center_x=(min_x+max_x)/2;
    let center_y=(min_y+max_y)/2;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(
        canvas.width/2,
        canvas.height/2 + Math.sin(floatOffset)*10
    );

    ctx.shadowColor="gold";
    ctx.shadowBlur=30;

    regionsData.slice(0,drawProgress).forEach(region=>{
        let r=region.color[0]*255;
        let g=region.color[1]*255;
        let b=region.color[2]*255;

        ctx.fillStyle=`rgb(${r},${g},${b})`;
        ctx.beginPath();

        region.contour.forEach((point,index)=>{
            let x=(point[0]-center_x)*scale;
            let y=(center_y-point[1])*scale;
            index===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        });

        ctx.closePath();
        ctx.fill();
    });

    ctx.restore();

    if(drawProgress<regionsData.length){
        drawProgress+=3;
    }

    floatOffset+=0.02;
}

function animate(){
    drawSunflower();
    requestAnimationFrame(animate);
}
</script>

</body>
</html>
